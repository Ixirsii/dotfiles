#:schema https://starship.rs/config-schema.json

# ############################################################################ #
#                                General config                                #
# ############################################################################ #

add_newline = true
continuation_prompt = "[󱞩](bold fg:green) "
format = """
[╭─](fg:subtext0) [](fg:sapphire)\
[ $os $username$hostname ](bg:sapphire fg:crust)\
[](bg:mauve fg:sapphire)\
[ $directory ](bg:mauve fg:crust)\
[](bg:maroon fg:mauve)\
[ $git_branch ($git_status )](bg:maroon fg:crust)\
[](bg:peach fg:maroon)\
[ $git_commit ($git_state )](bg:peach fg:crust)\
[](bg:blue fg:peach)\
[ $bun$cmake$dotnet$gradle$maven$nodejs ](bg:blue fg:crust)\
[](bg:lavender fg:blue)\
[ $c$cpp$golang$java$kotlin$odin$python$rust$zig ](bg:lavender fg:crust)\
[](bg:pink fg:lavender)\
[ $time ](bg:pink fg:crust)\
[ ](fg:pink)\
[$cmd_duration$line_break](fg:red)\
[╰─](fg:subtext0) $character """
palette = "catppuccin_mocha"

# ############################################################################ #
#                                   Machine                                    #
# ############################################################################ #

[directory]
format = "($read_only )$path"
home_symbol = "~"
read_only = ""
repo_root_format = "($read_only )$before_root_path$repo_root$path"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
use_os_path_sep = true

[directory.substitutions]
"Documents" = "󱧶"
"dotfiles" = ""
"Downloads" = "󰉍"
"git" = ""
"Music" = "󱍙"
"Pictures" = "󰉏"
"ryan" = "󰉌"
"Videos" = "󱧺"

[git_branch]
format = "$symbol $branch"
symbol = ""

[git_commit]
commit_hash_length = 8
format = "$hash $tag"
only_detached = true
tag_disabled = false
tag_max_candidates = 0
tag_symbol = ""

[git_state]
format = "$state($progress_current/$progress_total)"

[git_status]
format = "$all_status$ahead_behind"

[hostname]
format = "$ssh_symbol$hostname"
ssh_only = true
ssh_symbol = "@"
trim_at = "."

[sudo]
allow_windows = true
disabled = false
format = "$symbol"
symbol = "#"

[os]
disabled = false
format = "$symbol"

[os.symbols]
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Fedora = "󰣛"
FreeBSD = ""
Gentoo = "󰣨"
Linux = "󰌽"
Macos = "󰀵"
Manjaro = ""
Mint = "󰣭"
OpenBSD = ""
Raspbian = "󰐿"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
SUSE = ""
Ubuntu = "󰕈"
Windows = ""

[username]
format = "[$user]($style)"
show_always = true
style_root = "bg:sapphire fg:red"
style_user = "bg:sapphire fg:crust"

# ############################################################################ #
#                                    Prompt                                    #
# ############################################################################ #

[character]
disabled = false
format = "$symbol"
error_symbol = "[󰄛](bold fg:red)"
success_symbol = "[󰄛](bold fg:green)"
vimcmd_symbol = "[󰄛](bold fg:sapphire)"

[cmd_duration]
disabled = false
format = " $duration"
min_time = 2_000
min_time_to_notify = 45_000
show_milliseconds = true
show_notifications = false

[line_break]
disabled = false

[time]
disabled = false
format = " $time"
time_format = "%R"
use_12hr = false
utc_time_offset = "local"

# ############################################################################ #
#                                Build systems                                 #
# ############################################################################ #

[bun]
format = "$symbol ($version)"
symbol = ""

[cmake]
format = "$symbol ($version)"
symbol = ""

[dotnet]
format = "$symbol ($version)"
symbol = ""

[gradle]
format = "$symbol ($version)"
symbol = ""

[maven]
format = "$symbol ($version)"
symbol = ""

[nodejs]
format = "$symbol ($version)"
symbol = "󰎙"

# ############################################################################ #
#                                  Languages                                   #
# ############################################################################ #

[c]
format = "$symbol ($version)"
symbol = ""

[cpp]
format = "$symbol ($version)"
symbol = ""

[golang]
format = "$symbol ($version)"
symbol = ""

[java]
format = "$symbol ($version)"
symbol = " "

[kotlin]
format = "$symbol ($version)"
symbol = ""

[odin]
detect_extensions = ["odin"]
detect_files = ["odinfmt.json", "ols.json"]
format = "$symbol ($version)"
symbol = "Ø"

[python]
format = "$symbol ($version)"
symbol = ""

[rust]
format = "$symbol ($version)"
symbol = ""

[zig]
format = "$symbol ($version)"
symbol = ""

