# Sane prefix command
unbind C-b
set -g prefix C-a
bind C-a send-prefix

## Status Bar
set -g status-interval 1

# Start window numbers at 1
set -g base-index 1
set -g pane-base-index 1
set -gw pane-base-index 1
set -g renumber-windows on

# Clock Mode (C-a t)
set -g clock-mode-style 24

# Terminal emulator window title
set -gw automatic-rename on
set -gw automatic-rename-format "#{?#{!=:zsh,#{pane_current_command}},#{pane_current_command},#{b:pane_current_path}}"
set -g set-titles on
set -g set-titles-string "#W"

# History
set -g history-limit 10000

# Vi mode
set -gw mode-keys vi

# Image preview
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# More straight forward key bindings for splitting
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind \"
bind - split-window -v -c "#{pane_current_path}"

# Vi style window traversal
unbind c
bind n new-window
bind L next-window
bind H previous-window

# Allows for faster key repetition
set -s escape-time 0

# Window sizing properties
set -gw aggressive-resize on

# Which clipboard (in linux) to copy text to.
set -g @yank_selection "primary"

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Status line
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_current_number_color "#{@thm_sapphire}"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g status-left-length 0
set -g status-left ""

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_weather}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Plugins
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-battery"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "catppuccin/tmux"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "xamut/tmux-weather"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"
