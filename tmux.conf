# Sane prefix command
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 256-color terminal
set -g default-terminal "tmux-256color"
# RGB support
set -sa terminal-overrides ",alacritty:Tc"
set -sa terminal-overrides ",screen-256color:Tc"
set -sa terminal-overrides ",xterm-256color:Tc"

## Status Bar
# default statusbar colours
set -g status-fg "#c4c7d1"
set -g status-bg "#1e282d"

set -g status-interval 1
set -g status-justify left
set -g status-left ''
set -g status-right '#{pane_width}x#{pane_height} %m/%d #[bold]%H:%M:%S#[none] '

# Notifying if other windows has activities
set -g bell-action none
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity on

# Start window numbers at 1
set -g base-index 1

# Remove space between window titles 
set -g window-status-separator '' 

# Active window
setw -g window-status-current-style fg=#c4c7d1,bg=#29363d
setw -g window-status-current-format ' #I: #W '

# Inactive windows
setw -g window-status-style fg=#c4c7d1,bg=#1e282d
setw -g window-status-format ' #I: #W '

# Activity windows
setw -g window-status-activity-style fg=#c4c7d1,bg=#1e282d,bold

# Clock Mode (C-a t)
#set -g clock-mode-colour cyan
set -g clock-mode-style 24

# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '#W'

# History
set -g history-limit 10000

# Make mouse useful in copy mode
#setw -g mode-mouse on

# Vi mode
setw -g mode-keys vi

# More straight forward key bindings for splitting
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Vi style pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi style window traversal
unbind c
bind n new-window
bind L next-window
bind J previous-window

# Allows for faster key repetition
set -s escape-time 0

# Window sizing properties
setw -g aggressive-resize on

# Vi copy-paste mode
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
bind-key 'p' run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
bind-key -T copy-mode-vi 'Space' send -X halfpage-down
bind-key -T copy-mode-vi 'Bspace' send -X halfpage-up

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# auto window rename
setw -g automatic-rename

