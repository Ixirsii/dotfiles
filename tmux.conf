# Sane prefix command
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 256-color terminal
set -g default-terminal "screen-256color"

## Status Bar
# default statusbar colours
set -g status-fg "#263238"
set -g status-bg "#b0bec5"

set -g status-interval 1
set -g status-justify left
set -g status-attr dim
set -g status-left-length 20
set -g status-left ''
set -g status-right-length 50
set -g status-right '#{pane_width}x#{pane_height} %m/%d %H:%M:%S '

# Notifying if other windows has activities
set-option -g bell-action none
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity on

# Start window numbers at 1
set -g base-index 1

# Remove space between window titles 
set -g window-status-separator '' 

# Active window
setw -g window-status-current-fg "#263238"
setw -g window-status-current-bg "#eceff1"
setw -g window-status-current-attr none
setw -g window-status-current-format ' #I: #W#F '
# Inactive windows
setw -g window-status-fg "#263238"
setw -g window-status-bg "#b0bec5"
setw -g window-status-attr none
setw -g window-status-format ' #I: #W#F '

# Activity windows
setw -g window-status-activity-fg "#263238"
setw -g window-status-activity-bg "#b0bec5"
setw -g window-status-activity-attr bold

# Clock
setw -g clock-mode-colour cyan
setw -g clock-mode-style 24

# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '#W'

# History
set -g history-limit 10000

# Make mouse useful in copy mode
#setw -g mode-mouse on

# Vi mode
setw -g mode-keys vi

# More straight forward key bindings for splitting
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Vi style pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi style window traversal
unbind c
bind n new-window
bind L next-window
bind J previous-window

# Allows for faster key repetition
set -s escape-time 0

# Window sizing properties
setw -g aggressive-resize on

# Vi copy-paste mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
bind-key 'p' run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
bind-key -T copy-mode-vi 'Space' send -X halfpage-down
bind-key -T copy-mode-vi 'Bspace' send -X halfpage-up

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# auto window rename
set-window-option -g automatic-rename

