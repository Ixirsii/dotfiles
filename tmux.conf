# Sane prefix command
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 256-color terminal
set -g default-terminal "screen-256color"

# Status Bar
#setw -g utf8 on
#set-option -g status-utf8 on

set -g status-interval 1
set -g status-left-length 20
set -g status-right-length 20
set -g status-left '#[fg=cyan]#H#[white]'
set -g status-right '#[fg=cyan,bold]%H:%M:%S#[default]'

# default statusbar colours
set -g status-bg black
set -g status-fg black

# Notifying if other windows has activities
setw -g monitor-activity on
set -g visual-activity on

# Text color for windows in status bar
setw -g window-status-fg cyan
setw -g window-status-bg black
# Highlighting the active window in status bar
setw -g window-status-current-fg black
setw -g window-status-current-bg cyan
# Start window indexing at one
set -g base-index 1
# Center justify window list
set -g status-justify centre

# Clock
setw -g clock-mode-colour cyan
setw -g clock-mode-style 24

# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '#W'

# History
set -g history-limit 10000

# Make mouse useful in copy mode
#setw -g mode-mouse on

# Vi mode
setw -g mode-keys vi

# More straight forward key bindings for splitting
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Vi style pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi style window traversal
unbind c
bind n new-window
bind L next-window
bind J previous-window

# Allows for faster key repetition
set -s escape-time 0

# Window sizing properties
setw -g aggressive-resize on

# Vi copy-paste mode
set-window-option -g mode-keys vi
#bind-key -t vi-copy 'v' begin-selection
#bind-key -t vi-copy 'y' copy-selection

## Clipboard integration
# Copy buffer to clipboard
bind C-c run "tmux save-buffer - | xclip -i -selection clipboard"
# Paste content of clipboard
bind C-v run "tmux set-buffer -- \"$(xclip -o -selection clipboard)\"; tmux paste-buffer"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# auto window rename
set-window-option -g automatic-rename

